[project]
name = "migratowl"
version = "0.9.0"
description = "AI-powered dependency migration analyzer"
requires-python = ">=3.13"
dependencies = [
    "deepagents>=0.6,<0.7",  # 0.7 removes the callable backend API (agent/factory.py, agent/subagents.py)
    "fastapi>=0.115.0",
    "uvicorn>=0.30",
    # Maintained fork (MIT, originally bitkaio/langchain-kubernetes): carries the raw-mode
    # NetworkPolicy cleanup and the agent-sandbox reconnect fix that PyPI's 0.4.0 lacks.
    "langchain-kubernetes[agent-sandbox] @ git+https://github.com/barnakun/langchain-kubernetes@py-0.4.3#subdirectory=python",
    "langchain-anthropic",
    "langchain-openai",
    "pydantic>=2.0",
    "pydantic-settings>=2.14.2",
    "python-dotenv",
    "python-multipart>=0.0.31",
    "httpx>=0.27",
    "packaging>=24.0",
    "defusedxml>=0.7.1",
    "pyyaml>=6.0",
    "html2text>=2024.2.26",
    "langfuse",
    "aiosqlite>=0.20",
    "langgraph-checkpoint-sqlite>=2.0",
]

[tool.uv]
# langchain-kubernetes 0.4.0 declares `k8s-agent-sandbox>=0.1.0` (no upper bound),
# but the client API changed in 0.3+: SandboxClient.__init__ dropped `template_name`
# in favour of `connection_config`. Resolving to 0.3+ fails at runtime with
# `TypeError: SandboxClient.__init__() got an unexpected keyword argument 'template_name'`.
# Unit tests do not catch this (the sandbox backend is mocked) — only an E2E scan does.
# Lift this cap once langchain-kubernetes supports the newer client.
constraint-dependencies = [
    "k8s-agent-sandbox<0.3",
    # Security floor: pyasn1 0.6.4 has CVE-2026-119194, CVE-2026-119195,
    # CVE-2026-119196 and CVE-2026-119197, fixed in 0.6.5. Pulled in transitively via
    # google-auth -> pyasn1-modules; dependents declare open lower bounds, so pin
    # the floor to the fixed release.
    "pyasn1>=0.6.5",
    # Security floor: setuptools <83.0.0 has GHSA-h35f-9h28-mq5c (MANIFEST.in
    # exclusion bypass). Dev/build-only dep; not in the runtime export.
    "setuptools>=83.0.0",
    # Security floors on transitive deps; dependents only declare open lower
    # bounds, so pin each to the release that fixes the open Dependabot alerts.
    # PyJWT: 2.15.0 is the first release outside every advisory range
    # (incl. GHSA-42vr-xj54-vc7v and GHSA-gvp8-978c-rx2q); pulled in via
    # langchain-kubernetes / kubernetes auth.
    "pyjwt>=2.15.0",
    # urllib3 <2.8.0: GHSA-8988-9cw3-xx77, GHSA-vxq7-64xx-v4gw, GHSA-gh4c-6fx4-qh6g.
    "urllib3>=2.8.0",
    # anyio <4.14.2: GHSA-82r6-8w77-94w6 (TLS host name spoofing), GHSA-5p39-cfhj-2xmp.
    "anyio>=4.14.2",
    # oauthlib <4.0.1: GHSA-xpv3-w29h-x7cv, GHSA-hj66-6f7g-4r5v, and
    # CVE-2026-49272 (fixed in 4.0.1). Pulled in via kubernetes -> requests-oauthlib.
    "oauthlib>=4.0.1",
    # cryptography <50.0.0: GHSA-g6cj-pr64-35w5 (PKCS#7 Bleichenbacher oracle).
    # Transitive via google-auth / kubernetes (earlier floor: GHSA-537c-gmf6-5ccf).
    "cryptography>=50.0.0",
    # langgraph-checkpoint-sqlite <3.1.1: GHSA-47pj-3jcm-6whg.
    "langgraph-checkpoint-sqlite>=3.1.1",
    # langgraph-sdk <0.4.6: CVE-2026-104873 (fixed in 0.4.4) and CVE-2026-118667
    # (fixed in 0.4.6).
    "langgraph-sdk>=0.4.6",
    # certifi <2026.10.18: PYSEC-2026-4320. Transitive via requests / httpx.
    "certifi>=2026.10.18",
    # opentelemetry-api <1.45.1: CVE-2026-114603. Transitive via langfuse; the SDK
    # pins the API exactly, so this floor pulls a matching OpenTelemetry release.
    "opentelemetry-api>=1.45.1",
    # click <8.3.3: PYSEC-2026-2132 (GHSA-47fr-3ffg-hgmw). Dev-only, via langgraph-cli;
    # still scanned by Scorecard/OSV, which reads all of uv.lock.
    "click>=8.3.3",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio",
    "pytest-cov>=5.0",
    "ruff",
    "mypy>=1.10",
    "types-PyYAML",
    "bandit[toml]>=1.7",
    "langgraph-cli[inmem]",
    # 0.15.3–0.15.8 and 0.16.0–0.16.5 cap opentelemetry-exporter-prometheus below
    # 0.64, which pins the API at the vulnerable 1.42 line. 0.16.6 accepts the
    # 1.45 release that fixes CVE-2026-114603.
    "langgraph-api>=0.16.6",
    # Coverage-guided fuzzing of the untrusted-input manifest/changelog parsers.
    # Linux-only wheels; guarded so non-Linux dev installs still resolve.
    "atheris>=2.3.0 ; sys_platform == 'linux'",
    "ast-grep-py>=0.50",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["real_dns_guard: run the changelog public-address guard against its real resolver hook"]

[tool.setuptools.packages.find]
include = ["migratowl*"]

[tool.ruff]
target-version = "py313"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.bandit]
exclude_dirs = ["tests", ".venv"]
